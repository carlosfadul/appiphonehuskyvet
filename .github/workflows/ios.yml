name: Huskyvet iPhone prebuilt
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Verify Xcode and SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - run: npx cap sync ios
      - name: Compile Release for physical iPhone without signing
        run: bash scripts/ios-release.sh
      - run: npm run ios:simulator
        timeout-minutes: 12
        env:
          HUSKYVET_USE_PREBUILT: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Huskyvet-iPhone-simulator
          path: ios/App/output/
          retention-days: 14
